bad-500"> *</span></label><input id="_R_he_" autoComplete="given-name" required="" maxLength="50" aria-invalid="false" class="w-full rounded-lg border border-line bg-white px-3.5 text-sm text-ink-900 placeholder:text-ink-400 transition-colors focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/15 h-10 " name="firstName" value=""/></div><div class="" role="group" aria-labelledby="_R_11e_-label"><label id="_R_11e_-label" for="_R_11e_" class="mb-1.5 block text-[13px] font-medium text-ink-700">Last Name<span class="text-bad-500"> *</span></label><input id="_R_11e_" autoComplete="family-name" required="" maxLength="50" aria-invalid="false" class="w-full rounded-lg border border-line bg-white px-3.5 text-sm text-ink-900 placeholder:text-ink-400 transition-colors focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/15 h-10 " name="lastName" value=""/></div></div><div class="" role="group" aria-labelledby="_R_2e_-label"><label id="_R_2e_-label" for="_R_2e_" class="mb-1.5 block text-[13px] font-medium text-ink-700">Email<span class="text-bad-500"> *</span></label><input id="_R_2e_" type="email" autoComplete="email" required="" maxLength="120" aria-invalid="false" class="w-full rounded-lg border border-line bg-white px-3.5 text-sm text-ink-900 placeholder:text-ink-400 transition-colors focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/15 h-10 " name="email" value=""/></div><div class="" role="group" aria-labelledby="_R_3e_-label"><label id="_R_3e_-label" for="_R_3e_" class="mb-1.5 block text-[13px] font-medium text-ink-700">Phone (optional)</label><input id="_R_3e_" type="tel" autoComplete="tel" maxLength="20" aria-invalid="false" class="w-full rounded-lg border border-line bg-white px-3.5 text-sm text-ink-900 placeholder:text-ink-400 transition-colors focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/15 h-10 " name="phone" value=""/></div><div class="" role="group" aria-labelle
